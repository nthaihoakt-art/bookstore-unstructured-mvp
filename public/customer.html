<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhà sách Hoàng Gia — Cổng Khách Hàng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #0A3C2A;
  --primary-light: #16563e;
  --accent: #D9A74A;
  --accent-light: #f3d498;
  --bg: #FCFBF7;
  --card-bg: #FFFFFF;
  --text: #2A3631;
  --muted: #6C7D76;
  --border: #E6E2DA;
  --danger: #B42318;
  --danger-bg: #FEF3F2;
  --success: #027A48;
  --success-bg: #ECFDF3;
  --font-title: 'Outfit', sans-serif;
  --font-body: 'Inter', sans-serif;
  --shadow-sm: 0 2px 8px rgba(10, 60, 42, 0.04);
  --shadow-md: 0 8px 24px rgba(10, 60, 42, 0.08);
  --shadow-lg: 0 16px 40px rgba(10, 60, 42, 0.12);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-body);
  background-color: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  overflow-x: hidden;
}

/* Custom Scrollbar */
::-webkit-scrollbar {
  width: 8px;
}
::-webkit-scrollbar-track {
  background: var(--bg);
}
::-webkit-scrollbar-thumb {
  background: #C4BEB3;
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #A6A095;
}

/* Header & Glassmorphism */
.header-wrapper {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(252, 251, 247, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  transition: all 0.3s ease;
}

.header {
  max-width: 1200px;
  margin: 0 auto;
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.header .logo {
  font-family: var(--font-title);
  font-weight: 850;
  font-size: 24px;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  letter-spacing: -0.5px;
}

.header .logo span {
  color: var(--accent);
}

.header .user {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Search Box */
.search-box {
  flex: 1;
  max-width: 460px;
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 10px 18px 10px 42px;
  border: 1.5px solid var(--border);
  border-radius: 30px;
  font-size: 14px;
  font-family: var(--font-body);
  outline: 0;
  background-color: rgba(255, 255, 255, 0.6);
  color: var(--text);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.search-box input:focus {
  border-color: var(--primary);
  background-color: #ffffff;
  box-shadow: 0 0 0 4px rgba(10, 60, 42, 0.08);
}

.search-box::before {
  content: '🔍';
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  opacity: 0.6;
  pointer-events: none;
}

/* Buttons */
.btn {
  padding: 10px 20px;
  border-radius: 12px;
  border: 0;
  cursor: pointer;
  font-family: var(--font-title);
  font-weight: 700;
  font-size: 14px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-decoration: none;
}

.btn-primary {
  background: var(--primary);
  color: #ffffff;
  box-shadow: var(--shadow-sm);
}

.btn-primary:hover {
  background: var(--primary-light);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(10, 60, 42, 0.15);
}

.btn-accent {
  background: var(--accent);
  color: var(--primary);
  box-shadow: var(--shadow-sm);
}

.btn-accent:hover {
  background: var(--accent-light);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(217, 167, 74, 0.25);
}

.btn-ghost {
  background: transparent;
  color: var(--primary);
  border: 1px solid var(--border);
}

.btn-ghost:hover {
  background: rgba(10, 60, 42, 0.05);
  border-color: var(--primary);
  transform: translateY(-2px);
}

.btn-ghost.active {
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
}

.btn-danger {
  background: var(--danger-bg);
  color: var(--danger);
  border: 1px solid rgba(180, 35, 24, 0.2);
}

.btn-danger:hover {
  background: var(--danger);
  color: #ffffff;
  border-color: var(--danger);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(180, 35, 24, 0.15);
}

.btn-sm {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
}

/* Container */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 30px 24px;
}

/* Hero Section */
.hero {
  background: linear-gradient(135deg, #0A3C2A 0%, #1A5C48 100%);
  color: #ffffff;
  border-radius: 24px;
  padding: 48px;
  margin-bottom: 32px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-md);
}

.hero::after {
  content: '';
  position: absolute;
  right: -50px;
  bottom: -50px;
  width: 250px;
  height: 250px;
  background: radial-gradient(circle, rgba(217,167,74,0.15) 0%, rgba(217,167,74,0) 70%);
  border-radius: 50%;
  pointer-events: none;
}

.hero h1 {
  font-family: var(--font-title);
  font-size: 36px;
  font-weight: 800;
  line-height: 1.2;
  margin-bottom: 12px;
  letter-spacing: -0.5px;
}

.hero h1 span {
  color: var(--accent);
}

.hero p {
  font-size: 16px;
  color: rgba(255, 255, 255, 0.85);
  max-width: 600px;
}

/* Login Panel */
.login-box {
  max-width: 440px;
  margin: 6vh auto;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 36px;
  box-shadow: var(--shadow-lg);
  transition: all 0.3s ease;
}

.login-box h2 {
  font-family: var(--font-title);
  color: var(--primary);
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}

.login-box label {
  display: block;
  margin-top: 16px;
  font-weight: 600;
  color: var(--primary);
  font-size: 13px;
}

.login-box input {
  width: 100%;
  padding: 12px 16px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-size: 14px;
  margin-top: 6px;
  background-color: var(--bg);
  transition: all 0.3s ease;
}

.login-box input:focus {
  outline: 0;
  border-color: var(--primary);
  background-color: #ffffff;
  box-shadow: 0 0 0 4px rgba(10, 60, 42, 0.08);
}

.err {
  color: var(--danger);
  background-color: var(--danger-bg);
  border: 1.5px solid rgba(180, 35, 24, 0.1);
  padding: 10px 14px;
  border-radius: 12px;
  margin-top: 16px;
  font-size: 13px;
  font-weight: 500;
  min-height: 0;
  display: none;
}

/* Tab buttons and Layout */
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0;
}

.tab-btn {
  background: transparent;
  border: 0;
  padding: 12px 20px;
  cursor: pointer;
  font-family: var(--font-title);
  font-weight: 700;
  font-size: 15px;
  color: var(--muted);
  border-bottom: 3px solid transparent;
  margin-bottom: -1px;
  transition: all 0.3s ease;
}

.tab-btn:hover {
  color: var(--primary);
}

.tab-btn.active {
  color: var(--primary);
  border-bottom-color: var(--accent);
}

/* Grid Layout */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 24px;
}

/* Cards & Book Cards */
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 24px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
}

.card h3 {
  font-family: var(--font-title);
  color: var(--primary);
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 18px;
  letter-spacing: -0.5px;
}

.book-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-sm);
  position: relative;
}

.book-card:hover {
  transform: translateY(-8px);
  box-shadow: var(--shadow-lg);
  border-color: var(--accent);
}

.book-card-cover {
  width: 100%;
  aspect-ratio: 3/4;
  background: #F4EFE6;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-bottom: 1px solid var(--border);
  position: relative;
}

.book-card-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.book-card:hover .book-card-cover img {
  transform: scale(1.06);
}

.book-card-info {
  padding: 16px;
  display: flex;
  flex-direction: column;
  flex-grow: 1;
  gap: 6px;
}

.book-card h4 {
  font-family: var(--font-title);
  color: var(--primary);
  font-size: 15px;
  font-weight: 750;
  line-height: 1.4;
  height: 42px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin: 0;
}

.book-card .author {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.book-card .price-row {
  margin-top: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 8px;
}

.book-card .price {
  color: var(--danger);
  font-weight: 800;
  font-size: 18px;
  font-family: var(--font-title);
}

/* Membership Card VIP Widget */
.member-card-widget {
  background: linear-gradient(135deg, #1A4D3B 0%, #0A3C2A 100%);
  color: #ffffff;
  border-radius: 20px;
  padding: 20px;
  box-shadow: var(--shadow-md);
  border: 1px solid rgba(217, 167, 74, 0.2);
  position: relative;
  overflow: hidden;
}

.member-card-widget::before {
  content: '';
  position: absolute;
  top: -20px;
  right: -20px;
  width: 100px;
  height: 100px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 50%;
}

.member-card-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 30px;
  font-family: var(--font-title);
  font-weight: 800;
  font-size: 14px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.member-progress {
  height: 6px;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 3px;
  margin-top: 14px;
  position: relative;
  overflow: hidden;
}

.member-progress-bar {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  width: 0%;
  transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Tables */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
}

th, td {
  text-align: left;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  font-size: 13px;
}

th {
  font-family: var(--font-title);
  color: var(--primary);
  font-weight: 700;
  background: rgba(10, 60, 42, 0.03);
  font-size: 13px;
}

tr:hover td {
  background: rgba(10, 60, 42, 0.01);
}

/* Pills */
.pill {
  display: inline-block;
  background: rgba(217, 167, 74, 0.15);
  color: #7A550F;
  border-radius: 30px;
  padding: 4px 12px;
  font-size: 11px;
  font-weight: 700;
  font-family: var(--font-title);
}

.pill.success {
  background: var(--success-bg);
  color: var(--success);
}

/* Toast System */
#toastContainer {
  position: fixed;
  top: 24px;
  right: 24px;
  z-index: 10000;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 380px;
  width: 100%;
  pointer-events: none;
}

.toast {
  background: #ffffff;
  border-left: 4px solid var(--primary);
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 10px 30px rgba(10, 60, 42, 0.15);
  display: flex;
  align-items: center;
  gap: 12px;
  transform: translateX(120%);
  transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  pointer-events: auto;
  border: 1px solid var(--border);
}

.toast.show {
  transform: translateX(0);
}

.toast-icon {
  font-size: 20px;
  flex-shrink: 0;
}

.toast-content {
  flex: 1;
}

.toast-title {
  font-family: var(--font-title);
  font-weight: 700;
  font-size: 14px;
  color: var(--primary);
}

.toast-desc {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}

.toast.toast-success {
  border-left-color: var(--success);
}
.toast.toast-error {
  border-left-color: var(--danger);
}

/* Default SVG cover styling */
.svg-cover-fallback {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 20px;
  box-sizing: border-box;
  text-align: center;
  color: #ffffff;
}

.svg-cover-title {
  font-family: var(--font-title);
  font-weight: 800;
  font-size: 15px;
  line-height: 1.3;
  margin-top: 10px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.svg-cover-author {
  font-size: 11px;
  font-weight: 600;
  opacity: 0.85;
  margin-bottom: 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.svg-cover-badge {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  align-self: center;
  padding: 2px 8px;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 4px;
}

/* Media Responsive */
@media(max-width: 900px) {
  .hero {
    padding: 32px;
  }
  .hero h1 {
    font-size: 28px;
  }
}

@media(max-width: 768px) {
  .header {
    flex-direction: column;
    padding: 12px 16px;
    gap: 12px;
  }
  .search-box {
    width: 100%;
    max-width: 100%;
  }
  .header .user {
    width: 100%;
    justify-content: space-between;
    gap: 8px;
  }
  .header .user .btn {
    flex: 1;
    font-size: 12px;
    padding: 8px 12px;
  }
}
</style>
</head>
<body>
<div id="toastContainer"></div>
<div id="app">
  <div class="login-box">
    <h2>📚 Nhà sách Hoàng Gia</h2>
    <p class="muted" style="font-size: 13px; margin-top: 4px;">Đang tải dữ liệu cổng khách hàng. Vui lòng đợi...</p>
    <div style="width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 24px auto;"></div>
  </div>
</div>

<script>
  // Simple CSS spin animation keyframes injection
  const style = document.createElement('style');
  style.innerHTML = `@keyframes spin { to { transform: rotate(360deg); } }`;
  document.head.appendChild(style);

  // Global Toast function
  window.showToast = function(title, desc, type = 'success') {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    const icon = type === 'success' ? '✅' : '❌';
    toast.innerHTML = `
      <div class="toast-icon">${icon}</div>
      <div class="toast-content">
        <div class="toast-title">${title}</div>
        <div class="toast-desc">${desc}</div>
      </div>
    `;
    container.appendChild(toast);
    setTimeout(() => toast.classList.add('show'), 50);
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 400);
    }, 3500);
  };

  // Replace default alert
  window.alert = function(msg) {
    if (msg.toLowerCase().includes('thành công')) {
      window.showToast('Thành công', msg, 'success');
    } else if (msg.toLowerCase().includes('lỗi') || msg.toLowerCase().includes('chưa') || msg.toLowerCase().includes('hết')) {
      window.showToast('Thông báo', msg, 'error');
    } else {
      window.showToast('Thông báo', msg, 'success');
    }
  };

  window.addEventListener('error', function (e) {
    var root = document.getElementById('app');
    if (root) root.innerHTML = '<div class="login-box err" style="display:block;"><h3>Lỗi JavaScript</h3><pre style="white-space:pre-wrap; font-size:11px; margin-top:10px;">' + String(e.message || e.error || e).replace(/[&<>]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}) + '</pre></div>';
  });
</script>
<script src="/customer-app.js?v=fix14" defer></script>
</body>
</html>
